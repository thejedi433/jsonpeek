[project]
name = "jsonpeek"
version = "0.1.0"
description = "CLI tool to inspect JSON structure and content"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jsonpeek = "jsonpeek:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test_jsonpeek.py"]

[tool.coverage.run]
source = ["jsonpeek"]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
fail_under = 100
